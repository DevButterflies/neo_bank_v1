[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-system"
version = "3.4.0"
description = "Basel-III-aligned multi-pillar credit origination, guarantee-buffer, and governance microservices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "alembic>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bank*"]

[tool.setuptools.package-data]
bank = ["orchestrator/demo/static/*.html", "orchestrator/demo/static/*.css", "orchestrator/demo/static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"